name: Tennis Court Notifications

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # split restore/save so the cache is still written when the run fails
      - uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            ~/.cache/sf-tennis-cli
          key: courts-${{ github.run_id }}
          restore-keys: courts-
      - uses: oven-sh/setup-bun@v2
      - run: bun notify.ts
        env:
          TZ: America/Los_Angeles
          HOME_LAT: ${{ secrets.HOME_LAT }}
          HOME_LNG: ${{ secrets.HOME_LNG }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MAX_DISTANCE: ${{ vars.MAX_DISTANCE }}
          SPORTS: ${{ vars.SPORTS }}
          PREF_DAYS: ${{ vars.PREF_DAYS }}
          PREF_START_HOUR: ${{ vars.PREF_START_HOUR }}
          PREF_END_HOUR: ${{ vars.PREF_END_HOUR }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            .cache
            ~/.cache/sf-tennis-cli
          key: courts-${{ github.run_id }}
